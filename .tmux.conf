set-option -g prefix C-x
unbind-key C-x
bind-key C-x send-prefix
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on

# Don't delay Esc in Vim; a small value still recognizes key sequences over SSH.
set -sg escape-time 10

set -g default-terminal "tmux-256color"
# xterm-256color terminfo lacks truecolor even though Ptyxis and remote
# Ghostty sessions support it. Ghostty's own terminfo already declares it.
set -as terminal-features ",xterm-256color:RGB"

setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Use the native clipboard command for each platform.
if-shell 'uname | grep -q Linux' \
    'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"' \
    'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'
